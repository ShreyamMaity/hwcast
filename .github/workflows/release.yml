# Builds hwcast on GitHub-hosted Windows runners, optionally signs it through SignPath,
# and drafts a GitHub release.
#
# Run it by pushing a tag (git tag v0.2.0 && git push origin v0.2.0) or from the Actions tab.
# Signing runs only when the SIGNPATH_ORGANIZATION_ID repository variable is set;
# otherwise the release is built unsigned. Releases are created as drafts for review.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build hwcast.exe
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload unsigned exe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hwcast-unsigned
          path: target/release/hwcast.exe
          if-no-files-found: error

  sign:
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hwcast
          signing-policy-slug: release-signing
          artifact-configuration-slug: hwcast-exe
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed exe
        uses: actions/upload-artifact@v4
        with:
          name: hwcast-signed
          path: signed/hwcast.exe
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the signed exe
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: hwcast-signed
          path: bin

      - name: Get the unsigned exe (signing not configured yet)
        if: ${{ needs.sign.result == 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          name: hwcast-unsigned
          path: bin

      - name: Package release assets
        shell: pwsh
        run: ./scripts/package.ps1 -Exe bin/hwcast.exe

      - name: Show signature status
        shell: pwsh
        run: Get-AuthenticodeSignature dist/hwcast.exe | Format-List Status, SignerCertificate

      - name: Draft GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/hwcast.exe (Get-Item dist/hwcast-*.zip).FullName dist/SHA256SUMS.txt `
            --draft --verify-tag --title "hwcast $($tag.TrimStart('v'))" `
            --notes "Built by GitHub Actions from $tag. Download hwcast.exe and double-click it. See the README for details and the Code signing policy."

      - name: Keep the assets on manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: hwcast-release-assets
          path: dist/
