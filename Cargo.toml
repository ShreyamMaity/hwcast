[package]
name = "hwcast"
version = "0.2.0"
edition = "2021"
description = "Tiny headless Windows hardware telemetry, served as a live dashboard to any browser on your network"
license = "MIT"
readme = "README.md"

[dependencies]
serde_json = "1"
nvml-wrapper = "0.11"
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
